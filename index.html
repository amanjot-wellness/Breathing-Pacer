<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breathing Pacer</title>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js" defer></script>
<style>
  :root{
    --bg: #1E2A2E;
    --bg-soft: #263539;
    --bg-soft-2: #2C3D42;
    --ink: #EDE7DD;
    --ink-dim: #9FB0AD;
    --line: #3A4C4F;
    --figure: #C9A66B;
    --gold: #C9A66B;
    --sage: #7FA98C;
    --clay: #C97B63;
    --lavender: #9B9FC0;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(ellipse at 50% -10%, #2A3B3F 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display:flex;
    justify-content:center;
    padding: 40px 16px 60px;
  }

  .card{ width:100%; max-width: 460px; }

  .footer-logo{
    display:flex;
    justify-content:center;
    margin-top: 8px;
  }
  .footer-logo img{
    width: 52px;
    height: auto;
    display:block;
    opacity: 0.9;
  }

  .site-link{
    text-align:center;
    margin: 10px 0 0;
    font-size: 0.75rem;
    line-height: 1.7;
    color: var(--ink-dim);
  }
  .site-link a{
    color: var(--gold);
    text-decoration: none;
    letter-spacing: 0.04em;
    opacity: 0.85;
  }
  .site-link a:hover{ opacity: 1; text-decoration: underline; }

  h1{
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-weight: 500;
    font-size: 1.9rem;
    letter-spacing: 0.04em;
    text-align:center;
    margin: 4px 0 6px;
  }
  .subtitle{
    text-align:center;
    font-size: 0.95rem;
    color: var(--ink-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 28px;
  }

  .prayer-sketch{
    display:flex;
    justify-content:center;
    margin-bottom: 8px;
  }
  .prayer-sketch img{
    width: 190px;
    height: auto;
    display:block;
  }

  .figure-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 28px 0 8px;
  }

  .phase-label{
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 1.8rem;
    letter-spacing: 0.03em;
    margin-top: 18px;
    min-height: 2.2rem;
    transition: color 0.4s ease;
  }
  .phase-label.inhale{ color: var(--sage); }
  .phase-label.exhale{ color: var(--clay); }
  .phase-label.hold{ color: var(--lavender); }
  .phase-label.none{ color: var(--ink-dim); }

  .countdown{
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    font-size: 3rem;
    color: var(--ink);
    min-height: 3.4rem;
    line-height: 1;
  }

  .cycle-note{
    font-size: 0.75rem;
    color: var(--ink-dim);
    letter-spacing: 0.05em;
    min-height: 1.1rem;
  }

  .panel{
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    margin-top: 22px;
  }
  .panel h2{
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-dim);
    margin: 0 0 14px;
    font-weight: 600;
  }

  table.seq{ width:100%; border-collapse: collapse; }
  table.seq th{
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    text-align:left;
    font-weight: 500;
    padding-bottom: 8px;
  }
  table.seq td{ padding: 4px 0; }

  select.phase-select, input.seconds-input{
    background: var(--bg-soft-2);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.9rem;
    font-family: inherit;
  }
  select.phase-select{ width: 110px; }
  input.seconds-input{
    width: 40px;
    text-align:center;
    border-radius: 0;
    border-left: none;
    border-right: none;
  }
  /* hide native number spinner arrows since we use custom -/+ buttons */
  input.seconds-input::-webkit-inner-spin-button,
  input.seconds-input::-webkit-outer-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
  input.seconds-input{ -moz-appearance: textfield; appearance: textfield; }

  .seconds-stepper{
    display:inline-flex;
    align-items:stretch;
  }
  .stepper-btn{
    background: var(--bg-soft-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 1rem;
    font-family: inherit;
    width: 30px;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0;
  }
  .stepper-btn:first-child{ border-radius: 8px 0 0 8px; border-right: none; }
  .stepper-btn:last-child{ border-radius: 0 8px 8px 0; border-left: none; }
  .stepper-btn:hover{ color: var(--gold); }
  .stepper-btn:active{ transform: scale(0.94); }

  select.phase-select:focus, input.seconds-input:focus,
  button:focus-visible, input[type=range]:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .row-remove{
    background:none; border:none; color: var(--ink-dim);
    font-size: 1.1rem; cursor:pointer; padding: 0 6px; line-height:1;
  }
  .row-remove:hover{ color: var(--clay); }

  .add-row-btn{
    margin-top: 10px;
    background:none;
    border: 1px dashed var(--line);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
    cursor: pointer;
    width: 100%;
  }
  .add-row-btn:hover{ border-color: var(--gold); color: var(--gold); }

  .cycles-row{
    display:flex; align-items:center; justify-content:space-between; margin-top: 16px;
  }
  .cycles-row label{ font-size: 0.85rem; color: var(--ink-dim); }
  .cycles-row input{
    background: var(--bg-soft-2);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 10px;
    width: 60px;
    text-align:center;
    font-family: inherit;
  }

  .controls{ display:flex; gap: 10px; margin-top: 22px; }
  button.main-btn{
    flex:1; padding: 12px; border-radius: 10px; border: none;
    font-size: 0.95rem; font-weight: 600; letter-spacing: 0.02em;
    cursor:pointer; font-family: inherit;
  }
  .transport-controls{
    display:flex; justify-content:center; align-items:center;
    gap: 30px; margin: 30px 0 34px;
  }
  .icon-btn{
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; border:none; padding:0;
    transition: transform 0.12s ease, background 0.2s ease, opacity 0.2s ease;
  }
  .icon-btn:active{ transform: scale(0.94); }
  .icon-btn.primary{ width: 128px; height: 128px; background: var(--gold); }
  .icon-btn.primary svg{ width: 48px; height: 48px; fill: #22201A; }
  .icon-btn.secondary{ width: 72px; height: 72px; background: transparent; border: 1px solid var(--line); }
  .icon-btn.secondary svg{ fill: var(--ink); width: 24px; height: 24px; }
  .icon-btn:disabled{ opacity: 0.35; cursor:not-allowed; }
  .icon-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }

  body.is-paused .phase-label,
  body.is-paused .countdown{
    opacity: 0.5;
    transition: opacity 0.3s ease;
  }

  .sliders{ margin-top: 18px; }
  .slider-row{ margin-bottom: 14px; }
  .slider-row:last-child{ margin-bottom: 0; }
  .slider-row label{
    display:flex; justify-content:space-between; font-size: 0.78rem;
    color: var(--ink-dim); margin-bottom: 6px;
  }
  input[type=range]{ width: 100%; accent-color: var(--gold); }

  .tick-toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 16px; font-size: 0.85rem; color: var(--ink-dim);
  }
  .tick-toggle-row input[type=checkbox]{
    width: 18px; height: 18px; accent-color: var(--gold);
  }

  .tick-style-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 14px; font-size: 0.85rem; color: var(--ink-dim);
  }
  .tick-style-row select{
    background: var(--bg-soft-2);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.85rem;
    font-family: inherit;
  }

  footer.note{
    text-align:center; font-size: 0.72rem; color: var(--ink-dim);
    margin-top: 22px; line-height:1.5;
    min-height: 1.08rem;
  }
</style>
</head>

  const rowsBody = document.getElementById('rowsBody');
  const addRowBtn = document.getElementById('addRowBtn');
  const cyclesInput = document.getElementById('cyclesInput');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const stopBtn = document.getElementById('stopBtn');
  const phaseLabel = document.getElementById('phaseLabel');
  const countdown = document.getElementById('countdown');
  const cycleNote = document.getElementById('cycleNote');
  const volSlider = document.getElementById('volSlider');
  const ambienceToggle = document.getElementById('ambienceToggle');
  const ambienceStyleSelect = document.getElementById('ambienceStyleSelect');
  const ambienceVolSlider = document.getElementById('ambienceVolSlider');
  const ambienceVolVal = document.getElementById('ambienceVolVal');
  const tickToggle = document.getElementById('tickToggle');
  const tickStyleSelect = document.getElementById('tickStyleSelect');
  const voiceToggle = document.getElementById('voiceToggle');
  const tingToggle = document.getElementById('tingToggle');
  const tingStyleSelect = document.getElementById('tingStyleSelect');
  const volVal = document.getElementById('volVal');
  const saveBtn = document.getElementById('saveBtn');

  let running = false;
  let paused = false;
  let stoppedManually = false;
  let audioCtx = null;
  let noiseBuffer = null;
  let masterGain = null;
  let mediaStreamDest = null;
  let voiceSourceNodes = {};
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;
  let ffmpegInstance = null;
  let ambience = null;

  volSlider.addEventListener('input', () => volVal.textContent = volSlider.value + '%');

  function addRow(phase, seconds){
    const tr = document.createElement('tr');

    const tdPhase = document.createElement('td');
    const select = document.createElement('select');
    select.className = 'phase-select';
    ['Inhale','Hold','Exhale','None'].forEach(p => {
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      if (p === phase) opt.selected = true;
      select.appendChild(opt);
    });
    tdPhase.appendChild(select);

    const tdSeconds = document.createElement('td');
    const stepper = document.createElement('div');
    stepper.className = 'seconds-stepper';

    const minusBtn = document.createElement('button');
    minusBtn.type = 'button';
    minusBtn.className = 'stepper-btn';
    minusBtn.textContent = '\u2212';
    minusBtn.setAttribute('aria-label', 'Decrease seconds');

    const input = document.createElement('input');
    input.type = 'number'; input.min = '1'; input.value = seconds;
    input.className = 'seconds-input';

    const plusBtn = document.createElement('button');
    plusBtn.type = 'button';
    plusBtn.className = 'stepper-btn';
    plusBtn.textContent = '+';
    plusBtn.setAttribute('aria-label', 'Increase seconds');

    minusBtn.addEventListener('click', () => {
      const current = parseInt(input.value, 10) || 1;
      input.value = Math.max(1, current - 1);
    });
    plusBtn.addEventListener('click', () => {
      const current = parseInt(input.value, 10) || 0;
      input.value = current + 1;
    });

    stepper.appendChild(minusBtn);
    stepper.appendChild(input);
    stepper.appendChild(plusBtn);
    tdSeconds.appendChild(stepper);

    const tdRemove = document.createElement('td');
    const removeBtn = document.createElement('button');
    removeBtn.className = 'row-remove';
    removeBtn.textContent = '\u00d7';
    removeBtn.title = 'Remove phase';
    removeBtn.addEventListener('click', () => tr.remove());
    tdRemove.appendChild(removeBtn);

    tr.appendChild(tdPhase);
    tr.appendChild(tdSeconds);
    tr.appendChild(tdRemove);
    rowsBody.appendChild(tr);
  }

  addRow('Inhale', 6);
  addRow('Hold', 6);
  addRow('Exhale', 6);

  addRowBtn.addEventListener('click', () => addRow('Inhale', 4));

  function readSequence(){
    const seq = [];
    rowsBody.querySelectorAll('tr').forEach(tr => {
      const phase = tr.querySelector('.phase-select').value;
      const secs = parseInt(tr.querySelector('.seconds-input').value, 10);
      if (secs > 0) seq.push({ phase, seconds: secs });
    });
    return seq;
  }

  // ---- sound: soft wooden / mala-bead style tick instead of a beep ----
  function buildNoiseBuffer(){
    const bufferSize = audioCtx.sampleRate * 0.05;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++){
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
    }
    return buffer;
  }

  function tone(freq, peak, attack, decay, dest, type){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const now = audioCtx.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), now + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + attack + decay);
    osc.connect(gain).connect(dest);
    osc.start(now);
    osc.stop(now + attack + decay + 0.05);
  }

  function noiseBurst(peak, decay, filterFreq, filterQ, dest){
    const now = audioCtx.currentTime;
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq;
    filter.Q.value = filterQ;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(Math.max(peak, 0.0002), now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    noise.connect(filter).connect(gain).connect(dest);
    noise.start(now);
  }

  // -- Wood tap: two soft partials + a quick transient, a bit percussive --
  function playWoodTick(vol){
    tone(280, vol * 0.35, 0.005, 0.22, masterGain);
    tone(620, vol * 0.15, 0.005, 0.12, masterGain);
    noiseBurst(vol * 0.25, 0.05, 900, 0.7, masterGain);
  }

  // -- Soft bell: gentle sine with a light overtone, slower decay --
  function playBellTick(vol){
    tone(660, vol * 0.22, 0.01, 0.35, masterGain);
    tone(1320, vol * 0.06, 0.01, 0.22, masterGain);
  }

  // -- Singing bowl: low fundamental plus two soft harmonics, long gentle decay --
  function playBowlTick(vol){
    tone(220, vol * 0.18, 0.02, 0.6, masterGain);
    tone(440, vol * 0.09, 0.02, 0.5, masterGain);
    tone(660, vol * 0.05, 0.02, 0.4, masterGain);
  }

  // -- Gentle pulse: barely-there low tone, very soft and quick --
  function playPulseTick(vol){
    tone(200, vol * 0.12, 0.01, 0.1, masterGain);
  }

  // -- Soft raindrop: filtered noise only, no tone, brief and quiet --
  function playRainTick(vol){
    noiseBurst(vol * 0.18, 0.09, 2200, 0.9, masterGain);
  }

  function playClick(){
    if (!audioCtx) return;
    if (!tickToggle.checked) return;
    const vol = parseInt(volSlider.value, 10) / 100;
    if (vol <= 0) return;

    switch (tickStyleSelect.value){
      case 'bell': playBellTick(vol); break;
      case 'bowl': playBowlTick(vol); break;
      case 'pulse': playPulseTick(vol); break;
      case 'rain': playRainTick(vol); break;
      case 'wood':
      default: playWoodTick(vol); break;
    }
  }

  // -- Ting sounds: played once when a phase (Inhale/Hold/Exhale) begins --

  // Temple bell: clear fundamental with two soft overtones, medium decay
  function playTempleBell(vol){
    tone(880, vol * 0.28, 0.005, 0.9, masterGain);
    tone(1760, vol * 0.10, 0.005, 0.6, masterGain);
    tone(2640, vol * 0.05, 0.005, 0.4, masterGain);
  }

  // Crystal chime: two very close frequencies for a gentle shimmering beat
  function playCrystalChime(vol){
    tone(1200, vol * 0.16, 0.01, 1.1, masterGain);
    tone(1215, vol * 0.14, 0.01, 1.1, masterGain);
    tone(2400, vol * 0.05, 0.01, 0.7, masterGain);
  }

  // Soft gong: low fundamental, slow swell, long gentle decay
  function playSoftGong(vol){
    tone(150, vol * 0.22, 0.05, 1.8, masterGain);
    tone(300, vol * 0.10, 0.05, 1.4, masterGain);
    tone(450, vol * 0.05, 0.05, 1.0, masterGain);
  }

  // Wind chime: three high notes staggered slightly apart
  function playWindChime(vol){
    tone(1046, vol * 0.14, 0.01, 0.5, masterGain);
    setTimeout(() => { if (audioCtx) tone(1318, vol * 0.12, 0.01, 0.5, masterGain); }, 90);
    setTimeout(() => { if (audioCtx) tone(1568, vol * 0.10, 0.01, 0.5, masterGain); }, 180);
  }

  // Bowl swell: like the singing-bowl tick but slower attack, longer decay
  function playBowlSwell(vol){
    tone(220, vol * 0.16, 0.08, 1.5, masterGain);
    tone(440, vol * 0.08, 0.08, 1.2, masterGain);
    tone(660, vol * 0.04, 0.08, 0.9, masterGain);
  }

  function playTing(){
    if (!audioCtx || !tingToggle.checked) return;
    const vol = parseInt(volSlider.value, 10) / 100;
    if (vol <= 0) return;

    switch (tingStyleSelect.value){
      case 'crystal': playCrystalChime(vol); break;
      case 'gong': playSoftGong(vol); break;
      case 'wind': playWindChime(vol); break;
      case 'swell': playBowlSwell(vol); break;
      case 'bell':
      default: playTempleBell(vol); break;
    }
  }

  };
  const voiceAudio = {};
  Object.keys(VOICE_CLIPS).forEach(p => { voiceAudio[p] = new Audio(VOICE_CLIPS[p]); voiceAudio[p].preload = 'auto'; });

  // Creates the audio graph once: everything (ticks + voice) flows through
  // masterGain, which feeds both the speakers and the recorder stream.
  function ensureAudioGraph(){
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuffer = buildNoiseBuffer();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    mediaStreamDest = audioCtx.createMediaStreamDestination();
    masterGain.connect(audioCtx.destination);
    masterGain.connect(mediaStreamDest);
    Object.keys(voiceAudio).forEach(p => {
      const src = audioCtx.createMediaElementSource(voiceAudio[p]);
      src.connect(masterGain);
      voiceSourceNodes[p] = src;
    });
  }

  // ---- Background ambience: a continuous loop, independent of the phase sequence ----

  function buildBrownNoiseLoop(seconds){
    const length = Math.floor(audioCtx.sampleRate * seconds);
    const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < length; i++){
      const white = Math.random() * 2 - 1;
      lastOut = (lastOut + 0.02 * white) / 1.02;
      data[i] = lastOut * 3.5;
    }
    return buffer;
  }

  function currentAmbienceTarget(style){
    const vol = parseInt(ambienceVolSlider.value, 10) / 100;
    return style === 'birds' ? vol * 0.15 : vol;
  }

  function stopAmbience(){
    if (!ambience) return;
    (ambience.sources || []).forEach(s => { try { s.stop(); } catch(e){} });
    (ambience.oscillators || []).forEach(o => { try { o.stop(); } catch(e){} });
    (ambience.timers || []).forEach(t => clearTimeout(t));
    ambience = null;
  }

  function startAmbience(style){
    stopAmbience();
    ensureAudioGraph();
    if (style === 'ocean') ambience = startOcean();
    else if (style === 'rain') ambience = startRain();
    else if (style === 'bowl') ambience = startSingingBowl();
    else if (style === 'om') ambience = startOmDrone();
    else ambience = startBirds();
  }

  // ---- Birds: quiet noise bed + randomly-timed chirps ----
  function startBirds(){
    const source = audioCtx.createBufferSource();
    source.buffer = buildBrownNoiseLoop(6);
    source.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 400;
    const gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.0001;
    source.connect(filter).connect(gainNode).connect(masterGain);
    source.start();
    gainNode.gain.linearRampToValueAtTime(Math.max(currentAmbienceTarget('birds'), 0.0001), audioCtx.currentTime + 1.5);

    const state = { style: 'birds', gain: gainNode, sources: [source], oscillators: [], timers: [] };
    scheduleBirdChirp(state);
    return state;
  }

  function scheduleBirdChirp(state){
    if (!ambience || ambience !== state) return;
    const delay = 1200 + Math.random() * 2600;
    const id = setTimeout(() => {
      playBirdChirp();
      scheduleBirdChirp(state);
    }, delay);
    state.timers.push(id);
  }

  function playBirdChirp(){
    if (!audioCtx || !ambienceToggle.checked) return;
    const vol = (parseInt(ambienceVolSlider.value, 10) / 100) * 0.5;
    if (vol <= 0) return;
    const now = audioCtx.currentTime;
    const notes = 2 + Math.floor(Math.random() * 2);
    for (let i = 0; i < notes; i++){
      const start = now + i * 0.12;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      const base = 2600 + Math.random() * 900;
      osc.frequency.setValueAtTime(base, start);
      osc.frequency.exponentialRampToValueAtTime(base * 1.3, start + 0.05);
      osc.frequency.exponentialRampToValueAtTime(base * 0.9, start + 0.11);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0005), start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);
      osc.connect(gain).connect(masterGain);
      osc.start(start);
      osc.stop(start + 0.15);
    }
  }

  // ---- Ocean waves: brown noise wash, gain modulated by two slow overlapping LFOs (smoother swell than a filter sweep) ----
  function startOcean(){
    const source = audioCtx.createBufferSource();
    source.buffer = buildBrownNoiseLoop(8);
    source.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 550;

    const swellGain = audioCtx.createGain();
    swellGain.gain.value = 0.6;
    const lfo1 = audioCtx.createOscillator(); lfo1.frequency.value = 0.07;
    const lfo1Gain = audioCtx.createGain(); lfo1Gain.gain.value = 0.22;
    const lfo2 = audioCtx.createOscillator(); lfo2.frequency.value = 0.13;
    const lfo2Gain = audioCtx.createGain(); lfo2Gain.gain.value = 0.12;
    lfo1.connect(lfo1Gain).connect(swellGain.gain);
    lfo2.connect(lfo2Gain).connect(swellGain.gain);
    lfo1.start(); lfo2.start();

    const outGain = audioCtx.createGain();
    outGain.gain.value = 0.0001;
    source.connect(filter).connect(swellGain).connect(outGain).connect(masterGain);
    source.start();
    outGain.gain.linearRampToValueAtTime(Math.max(currentAmbienceTarget('ocean'), 0.0001), audioCtx.currentTime + 1.5);

    return { style: 'ocean', gain: outGain, sources: [source], oscillators: [lfo1, lfo2], timers: [] };
  }

  // ---- Rain: steady high-passed noise, gentle low-rate flutter for texture ----
  function startRain(){
    const source = audioCtx.createBufferSource();
    source.buffer = buildBrownNoiseLoop(6);
    source.loop = true;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1000;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 6000;

    const baseGain = audioCtx.createGain();
    baseGain.gain.value = 0.7;
    const flutter = audioCtx.createOscillator(); flutter.frequency.value = 0.6;
    const flutterGain = audioCtx.createGain(); flutterGain.gain.value = 0.06;
    flutter.connect(flutterGain).connect(baseGain.gain);
    flutter.start();

    const outGain = audioCtx.createGain();
    outGain.gain.value = 0.0001;
    source.connect(hp).connect(lp).connect(baseGain).connect(outGain).connect(masterGain);
    source.start();
    outGain.gain.linearRampToValueAtTime(Math.max(currentAmbienceTarget('rain'), 0.0001), audioCtx.currentTime + 1.5);

    return { style: 'rain', gain: outGain, sources: [source], oscillators: [flutter], timers: [] };
  }

  // ---- Singing bowl: soft overlapping struck strikes with long harmonic decay ----
  function startSingingBowl(){
    const outGain = audioCtx.createGain();
    outGain.gain.value = 0.0001;
    outGain.connect(masterGain);
    outGain.gain.linearRampToValueAtTime(Math.max(currentAmbienceTarget('bowl'), 0.0001), audioCtx.currentTime + 1.5);

    const state = { style: 'bowl', gain: outGain, sources: [], oscillators: [], timers: [] };

    function strike(){
      if (!ambience || ambience !== state) return;
      const now = audioCtx.currentTime;
      const base = 210 + Math.random() * 20;
      [1, 2.0, 2.76, 3.98].forEach((mult, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = base * mult;
        const g = audioCtx.createGain();
        const peak = [0.3, 0.14, 0.08, 0.05][i];
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(peak, now + 0.06);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 7.5);
        osc.connect(g).connect(outGain);
        osc.start(now);
        osc.stop(now + 7.6);
      });
      const id = setTimeout(strike, 6500 + Math.random() * 2000);
      state.timers.push(id);
    }
    strike();

    return state;
  }

  // ---- Om drone: low sustained detuned partials through a vocal-ish formant filter, slow breathing swell ----
  function startOmDrone(){
    const outGain = audioCtx.createGain();
    outGain.gain.value = 0.0001;

    const baseGain = audioCtx.createGain();
    baseGain.gain.value = 0.55;
    const breathe = audioCtx.createOscillator(); breathe.frequency.value = 0.045;
    const breatheGain = audioCtx.createGain(); breatheGain.gain.value = 0.18;
    breathe.connect(breatheGain).connect(baseGain.gain);
    breathe.start();

    const formant = audioCtx.createBiquadFilter();
    formant.type = 'bandpass';
    formant.frequency.value = 220;
    formant.Q.value = 3;

    const oscillators = [breathe];
    [98, 98 * 1.005, 196, 294].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = i < 2 ? 'sawtooth' : 'sine';
      osc.frequency.value = freq;
      const g = audioCtx.createGain();
      g.gain.value = [0.5, 0.4, 0.15, 0.08][i];
      osc.connect(g).connect(formant);
      osc.start();
      oscillators.push(osc);
    });

    formant.connect(baseGain).connect(outGain).connect(masterGain);
    outGain.gain.linearRampToValueAtTime(Math.max(currentAmbienceTarget('om'), 0.0001), audioCtx.currentTime + 2);

    return { style: 'om', gain: outGain, sources: [], oscillators, timers: [] };
  }

  function fadeOutAndStopAmbience(){
    if (!ambience) return;
    const amb = ambience;
    amb.gain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.3);
    setTimeout(() => { if (ambience === amb) stopAmbience(); }, 900);
  }

  ambienceToggle.addEventListener('change', () => {
    if (ambienceToggle.checked){
      ensureAudioGraph();
      // Only auto-start right away if a practice session is actively running;
      // otherwise it'll start the next time Play is pressed.
      if (running && !paused) startAmbience(ambienceStyleSelect.value);
    } else {
      fadeOutAndStopAmbience();
    }
  });

  ambienceStyleSelect.addEventListener('change', () => {
    if (ambienceToggle.checked && running && !paused) startAmbience(ambienceStyleSelect.value);
  });

  ambienceVolSlider.addEventListener('input', () => {
    ambienceVolVal.textContent = ambienceVolSlider.value + '%';
    if (ambience){
      ambience.gain.gain.setTargetAtTime(
        Math.max(currentAmbienceTarget(ambience.style), 0.0001),
        audioCtx.currentTime,
        0.1
      );
    }
  });

  function speak(phase){
    const clip = voiceAudio[phase];
    if (!clip) return;
    clip.pause();
    clip.currentTime = 0;
    clip.volume = parseInt(volSlider.value, 10) / 100;
    clip.play().catch(() => {});
  }

  function wait(ms){
    return new Promise(resolve => {
      let remaining = ms;
      let lastTick = Date.now();
      (function poll(){
        if (!running) return resolve();
        if (paused){
          lastTick = Date.now();
          setTimeout(poll, 150);
          return;
        }
        const now = Date.now();
        remaining -= (now - lastTick);
        lastTick = now;
        if (remaining <= 0) return resolve();
        setTimeout(poll, Math.min(150, remaining));
      })();
    });
  }

  async function runSequence(sequence, cycles){
    for (let c = 1; c <= cycles; c++){
      if (!running) break;
      cycleNote.textContent = 'Cycle ' + c + ' of ' + cycles;
      for (const step of sequence){
        if (!running) break;
        const phase = step.phase;
        const seconds = step.seconds;

        phaseLabel.textContent = phase;
        phaseLabel.className = 'phase-label ' + phase.toLowerCase();
        if (phase !== 'None' && voiceToggle.checked) speak(phase);
        if (phase !== 'None') playTing();

        for (let remaining = seconds; remaining >= 1; remaining--){
          if (!running) break;
          countdown.textContent = remaining;
          if (phase !== 'None') playClick();
          await wait(1000);
        }
      }
    }
    finish();
  }

  function pickRecordingMimeType(){
    const candidates = ['audio/webm;codecs=opus', 'audio/webm'];
    for (const c of candidates){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
    }
    return '';
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Converts the recorded webm into a genuine .mp4 using ffmpeg.wasm (loaded from
  // a CDN the first time it's needed). Falls back to the .webm download if the
  // conversion can't run (e.g. no internet available at that moment).
  async function finishRecording(webmBlob){
    saveBtn.textContent = 'Converting to MP4…';
    try {
      if (typeof FFmpeg === 'undefined') throw new Error('ffmpeg.wasm not loaded');
      const { createFFmpeg, fetchFile } = FFmpeg;
      if (!ffmpegInstance){
        ffmpegInstance = createFFmpeg({ log: false });
        await ffmpegInstance.load();
      }
      ffmpegInstance.FS('writeFile', 'input.webm', await fetchFile(webmBlob));
      await ffmpegInstance.run('-i', 'input.webm', '-c:a', 'aac', '-b:a', '160k', 'output.mp4');
      const data = ffmpegInstance.FS('readFile', 'output.mp4');
      downloadBlob(new Blob([data.buffer], { type: 'audio/mp4' }), 'breathing-sequence.mp4');
      try { ffmpegInstance.FS('unlink', 'input.webm'); ffmpegInstance.FS('unlink', 'output.mp4'); } catch(e){}
    } catch (err){
      downloadBlob(webmBlob, 'breathing-sequence.webm');
    }
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save audio file';
  }

  function finish(){
    running = false;
    paused = false;
    playPauseBtn.disabled = false;
    stopBtn.disabled = true;
    phaseLabel.textContent = stoppedManually ? 'Stopped' : 'Done';
    phaseLabel.className = 'phase-label';
    countdown.textContent = '';
    cycleNote.textContent = '';
    updatePlayPauseIcon();
    fadeOutAndStopAmbience();
    if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.stop(); // onstop -> finishRecording(), which owns saveBtn's state from here
    } else {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save audio file';
    }
    isRecording = false;
    stoppedManually = false;
  }

  function updatePlayPauseIcon(){
    const showPause = running && !paused;
    playIcon.style.display = showPause ? 'none' : '';
    pauseIcon.style.display = showPause ? '' : 'none';
    playPauseBtn.setAttribute('aria-label', showPause ? 'Pause' : (paused ? 'Resume' : 'Start'));
    document.body.classList.toggle('is-paused', running && paused);
  }

  playPauseBtn.addEventListener('click', () => {
    if (!running){
      const sequence = readSequence();
      if (sequence.length === 0) {
        phaseLabel.textContent = 'Add a phase first';
        return;
      }
      ensureAudioGraph();
      const cycles = Math.max(1, parseInt(cyclesInput.value, 10) || 1);
      running = true;
      paused = false;
      stopBtn.disabled = false;
      saveBtn.disabled = true;
      updatePlayPauseIcon();
      if (ambienceToggle.checked) startAmbience(ambienceStyleSelect.value);
      runSequence(sequence, cycles);
    } else if (!paused){
      paused = true;
      Object.values(voiceAudio).forEach(a => a.pause());
      fadeOutAndStopAmbience();
      updatePlayPauseIcon();
    } else {
      paused = false;
      if (ambienceToggle.checked) startAmbience(ambienceStyleSelect.value);
      updatePlayPauseIcon();
    }
  });

  stopBtn.addEventListener('click', () => {
    stoppedManually = true;
    running = false;
    paused = false;
    Object.values(voiceAudio).forEach(a => { a.pause(); a.currentTime = 0; });
    fadeOutAndStopAmbience();
    updatePlayPauseIcon();
  });

  saveBtn.addEventListener('click', () => {
    if (running) return;
    const sequence = readSequence();
    if (sequence.length === 0) {
      phaseLabel.textContent = 'Add a phase first';
      return;
    }
    ensureAudioGraph();
    const mimeType = pickRecordingMimeType();
    if (!mimeType){
      phaseLabel.textContent = "Can't record in this browser";
      return;
    }
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(mediaStreamDest.stream, { mimeType });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      finishRecording(new Blob(recordedChunks, { type: mimeType }));
    };

    const cycles = Math.max(1, parseInt(cyclesInput.value, 10) || 1);
    isRecording = true;
    running = true;
    paused = false;
    playPauseBtn.disabled = true;
    stopBtn.disabled = false;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Recording…';
    mediaRecorder.start();
    runSequence(sequence, cycles);
  });

  // Background sound defaults to on, but browsers won't let audio play until
  // the person has interacted with the page at least once — this catches
  // that first interaction (whatever it is) and starts it then.
  function tryAutoStartAmbience(){
    if (ambienceToggle.checked && !ambience){
      ensureAudioGraph();
      startAmbience(ambienceStyleSelect.value);
    }
  }
  document.addEventListener('pointerdown', tryAutoStartAmbience, { once: true });
  document.addEventListener('keydown', tryAutoStartAmbience, { once: true });
})();
</script>
</body>
</html>
